[project]
name = "silverc"
version = "0.1.0"
description = "Validatore di insegne FAI per piloti di alianti a partire da file IGC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geographiclib>=2.0",
]

[project.scripts]
silverc = "silverc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silverc"]
